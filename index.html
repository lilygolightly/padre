<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ポモドーロ畑</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ポモドーロ畑">
<meta name="theme-color" content="#13221B">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<link rel="manifest" href="./manifest.json">
<style>
  :root{
    --soil:#13221B; --bed:#1C3226; --line:#2E4936; --ink:#EDF4E7;
    --mute:#8DA88A; --tomato:#E23E2C; --ripening:#F2B33D; --leaf:#6FA24B; --sky:#74B6C9;
    --jp:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","Hiragino Sans",system-ui,sans-serif;
    --num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --accent:var(--tomato);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--soil);color:var(--ink);font-family:var(--jp);
    min-height:100%;-webkit-user-select:none;user-select:none}
  body{padding:max(22px,env(safe-area-inset-top)) 14px calc(34px + env(safe-area-inset-bottom))}
  .wrap{max-width:430px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  header{display:flex;align-items:baseline;justify-content:space-between}
  h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.06em}
  .date{font-family:var(--num);font-size:12px;color:var(--mute);letter-spacing:.08em}
  .card{background:var(--bed);border:1px solid var(--line);border-radius:20px}
  .timer{padding:26px 20px 20px;text-align:center}
  .phase{font-size:12px;letter-spacing:.22em;color:var(--accent);margin-bottom:6px}
  .clock{font-family:var(--num);font-size:68px;font-weight:300;line-height:1;
    letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .track{height:3px;background:var(--line);border-radius:3px;margin:20px 4px 18px;overflow:hidden}
  .fill{height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .3s linear}
  .row{display:grid;gap:10px}
  button{font-family:inherit;font-size:15px;font-weight:600;letter-spacing:.04em;
    padding:13px 0;border-radius:999px;cursor:pointer;border:1.5px solid var(--line);
    background:transparent;color:var(--mute)}
  button.primary{border-color:var(--accent);background:var(--accent);color:#14221B}
  button:focus-visible,input:focus-visible{outline:2px solid var(--ripening);outline-offset:2px}
  .harvest{padding:18px 18px 16px}
  .label{font-size:13px;letter-spacing:.14em;color:var(--mute)}
  .between{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
  #tomatoes{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;min-height:40px}
  .big{font-family:var(--num);font-size:40px;line-height:1;color:var(--line)}
  .big.on{color:var(--tomato)}
  input{background:var(--bed);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;color:var(--ink);font-size:15px;width:100%;font-family:inherit;
    -webkit-user-select:text;user-select:text}
  input::placeholder{color:#5F7A5E}
  .unitrow{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center}
  #unit{font-family:var(--num);text-align:center}
  .note{font-size:13px;color:var(--mute);line-height:1.5;min-height:20px}
  .week{display:flex;gap:8px;align-items:flex-end;height:84px}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
  .bar{width:100%;border-radius:5px;background:var(--line);transition:height .4s ease}
  .cap{font-family:var(--num);font-size:11px;color:var(--line)}
  .dow{font-size:11px;color:var(--mute)}
  .toggles{display:flex;gap:14px;justify-content:center;font-size:13px;flex-wrap:wrap}
  .toggles button{border:none;background:none;padding:4px;font-weight:400;color:var(--mute)}
  .dot{color:var(--line);margin-right:6px}
  .hide{display:none}
  .swing{animation:swing 2.6s ease-in-out infinite;transform-origin:50% 15%}
  @keyframes swing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  @media (prefers-reduced-motion:reduce){.swing{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>ポモドーロ畑</h1><span class="date" id="today"></span></header>

  <section class="card timer">
    <div class="phase" id="phase">しゅうちゅう</div>
    <div class="clock" id="clock">25:00</div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="row" id="ctrl" style="grid-template-columns:2fr 1fr">
      <button class="primary" id="go">はじめる</button>
      <button id="reset">リセット</button>
    </div>
  </section>

  <section class="card harvest">
    <div class="between"><span class="label">今日の収穫</span><span class="label" id="mins" style="font-family:var(--num)">0分</span></div>
    <div id="tomatoes"></div>
    <div style="margin-top:12px;display:flex;align-items:baseline;gap:8px">
      <span class="big" id="count">0</span><span class="note">回 / 25分</span>
    </div>
  </section>

  <section style="display:grid;gap:8px">
    <div class="unitrow">
      <input id="unit" inputmode="numeric" placeholder="ユニット№">
      <div class="note" id="unitnote">番号を入れるとユニットごとに集計します</div>
    </div>
    <input id="memo" placeholder="この1回のメモ">
  </section>

  <section class="card" style="padding:18px 18px 14px">
    <div class="label" style="margin-bottom:14px">この1週間</div>
    <div class="week" id="week"></div>
  </section>

  <section style="display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;justify-content:space-between" class="note">
      <span>Notionへ</span><span id="pending"></span>
    </div>
    <button id="send">今日の記録をコピー</button>
    <div class="note" id="sendnote">貼りつけるとNotionの2つのDBに記録できます</div>
  </section>

  <section class="toggles">
    <button id="tAuto"><span class="dot">●</span>休憩を自動ではじめる</button>
    <button id="tSound"><span class="dot">●</span>音を鳴らす</button>
  </section>
</div>

<script>
const WORK=25*60, BREAK=5*60, LONG=15*60, KEY="pomodoro-farm";
const pad=n=>String(n).padStart(2,"0");
const dayKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hhmm=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
const mmss=s=>`${pad(Math.floor(Math.max(0,s)/60))}:${pad(Math.max(0,s)%60)}`;

let S={sessions:[],unit:"",autoBreak:true,soundOn:true};
try{const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r));}catch(e){}
const save=()=>{try{S.sessions=S.sessions.slice(-800);localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};

let mode="work", running=false, endsAt=null, left=WORK, fired=false;
const total=()=>mode==="work"?WORK:mode==="long"?LONG:BREAK;
const $=id=>document.getElementById(id);

/* ── 音 ── */
let ctx=null;
function audio(){ if(!ctx){const A=window.AudioContext||window.webkitAudioContext; if(!A)return null; ctx=new A();}
  if(ctx.state==="suspended") ctx.resume(); return ctx; }
function chime(kind){
  if(!S.soundOn) return; const c=audio(); if(!c) return;
  const seq=kind==="work"
    ?[523.25,659.25,783.99,1046.5,0,523.25,659.25,783.99,1046.5,0,523.25,659.25,783.99,1046.5]
    :[880,659.25];
  const t0=c.currentTime+.05;
  seq.forEach((f,i)=>{ if(!f) return; const at=t0+i*.19;
    const o=c.createOscillator(), g=c.createGain();
    o.type="sine"; o.frequency.value=f;
    g.gain.setValueAtTime(0,at); g.gain.linearRampToValueAtTime(.28,at+.02);
    g.gain.exponentialRampToValueAtTime(.0008,at+.85);
    o.connect(g); g.connect(c.destination); o.start(at); o.stop(at+.9); });
  if(navigator.vibrate) navigator.vibrate(kind==="work"?[400,180,400]:[200]);
}

/* ── 画面スリープ防止 ── */
let lock=null;
async function wake(on){ try{
  if(on&&navigator.wakeLock&&!lock) lock=await navigator.wakeLock.request("screen");
  else if(!on&&lock){ lock.release(); lock=null; }
}catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&running) wake(true); });

/* ── トマトの色 ── */
function ripe(p){
  const st=[[0,[111,162,75]],[.55,[242,179,61]],[1,[226,62,44]]];
  const t=Math.min(1,Math.max(0,p)); let a=st[0],b=st[2];
  for(let i=0;i<st.length-1;i++) if(t>=st[i][0]&&t<=st[i+1][0]){a=st[i];b=st[i+1];break;}
  const k=b[0]===a[0]?0:(t-a[0])/(b[0]-a[0]);
  return "rgb("+a[1].map((v,i)=>Math.round(v+(b[1][i]-v)*k)).join(",")+")";
}
function tomatoSVG(fill,dim,pulse){
  return `<svg width="34" height="34" viewBox="0 0 40 40" class="${pulse?'swing':''}" style="display:block">
    <circle cx="20" cy="24" r="12.5" fill="${dim?'none':fill}" stroke="${dim?'#2E4936':'rgba(0,0,0,.18)'}"
      stroke-width="${dim?1.5:1}" ${dim?'stroke-dasharray="3 3"':''}/>
    ${dim?'':`<ellipse cx="15.5" cy="19.5" rx="3.4" ry="2.2" fill="rgba(255,255,255,.32)" transform="rotate(-25 15.5 19.5)"/>
    <path d="M20 12.5 L20 9" stroke="#4E7A38" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M20 12.5 L13.5 9.5 M20 12.5 L26.5 9.5 M20 12.5 L15.5 14.5 M20 12.5 L24.5 14.5" stroke="#5C8C41" stroke-width="2" stroke-linecap="round"/>`}
  </svg>`;
}

/* ── 描画 ── */
function render(){
  const today=dayKey(new Date());
  const n=S.sessions.filter(s=>s.date===today).length;
  const t=total(), prog=1-left/t;
  document.documentElement.style.setProperty("--accent", mode==="work"?"#E23E2C":"#74B6C9");
  $("today").textContent=today.slice(5).replace("-"," / ");
  $("phase").textContent=mode==="work"?"しゅうちゅう":mode==="long"?"ながめの休憩":"きゅうけい";
  $("clock").textContent=mmss(left);
  $("fill").style.width=(prog*100)+"%";
  $("go").textContent= left===t ? "はじめる":"つづける";
  $("go").classList.toggle("hide",running);
  $("pause").classList.toggle("hide",!running);
  $("ctrl").style.gridTemplateColumns=running?"1fr 1fr":"2fr 1fr";
  $("count").textContent=n; $("count").classList.toggle("on",n>0);
  $("mins").textContent=(n*25)+"分";

  const slots=Math.max(8,n+1); let html="";
  for(let i=0;i<slots;i++){
    if(i<n) html+=tomatoSVG(ripe(1),false,false);
    else if(i===n&&mode==="work"&&prog>.02) html+=tomatoSVG(ripe(prog),false,running);
    else html+=tomatoSVG("",true,false);
  }
  $("tomatoes").innerHTML=html;

  // ユニット累計
  const u=parseFloat($("unit").value);
  if(!isNaN(u)&&u>0){
    const c=S.sessions.filter(s=>s.unit===u).length;
    $("unitnote").innerHTML=`ユニット ${u} の累計<br><span style="font-family:var(--num);color:var(--leaf)">${c} 回 / ${c*25}分</span>`;
  } else $("unitnote").textContent="番号を入れるとユニットごとに集計します";

  // 1週間
  let wk="",max=4;
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));
    const k=dayKey(d); return {k,dow:"日月火水木金土"[d.getDay()],n:S.sessions.filter(s=>s.date===k).length,me:k===today};});
  days.forEach(d=>max=Math.max(max,d.n));
  days.forEach(d=>{ wk+=`<div class="col">
    <span class="cap" style="${d.n?'color:var(--ink)':''}">${d.n||""}</span>
    <div class="bar" style="height:${Math.max(3,d.n/max*56)}px;background:${d.n?(d.me?'var(--tomato)':'#4A7A48'):'var(--line)'}"></div>
    <span class="dow" style="${d.me?'color:var(--ink)':''}">${d.dow}</span></div>`; });
  $("week").innerHTML=wk;

  const un=S.sessions.filter(s=>!s.sent).length;
  $("pending").textContent=un?`未送信 ${un}件`:"送信済み";
  $("pending").style.color=un?"var(--ripening)":"var(--mute)";

  $("tAuto").querySelector(".dot").style.color=S.autoBreak?"var(--leaf)":"var(--line)";
  $("tAuto").style.color=S.autoBreak?"var(--ink)":"var(--mute)";
  $("tSound").querySelector(".dot").style.color=S.soundOn?"var(--leaf)":"var(--line)";
  $("tSound").style.color=S.soundOn?"var(--ink)":"var(--mute)";
}

/* ── タイマー ── */
let iv=null;
function loop(){
  clearInterval(iv);
  iv=setInterval(()=>{
    if(!running||!endsAt) return;
    const rest=Math.round((endsAt-Date.now())/1000);
    left=rest>0?rest:0;
    if(rest<=0&&!fired){ fired=true; finish(); }
    render();
  },250);
}
function start(){ audio(); fired=false; endsAt=Date.now()+left*1000; running=true; wake(true); loop(); render(); }
function pause(){ running=false; endsAt=null; wake(false); render(); }
function reset(){ running=false; endsAt=null; left=total(); fired=false; wake(false); render(); }

function finish(){
  running=false; endsAt=null; wake(false);
  if(mode==="work"){
    chime("work");
    const now=new Date(), u=parseFloat($("unit").value);
    S.sessions.push({date:dayKey(now),time:hhmm(now),unit:isNaN(u)?null:u,
      memo:$("memo").value.trim(),sent:false});
    save(); $("memo").value="";
    const n=S.sessions.filter(s=>s.date===dayKey(now)).length;
    mode=(n%4===0)?"long":"break"; left=total();
    if(S.autoBreak) setTimeout(()=>{fired=false;endsAt=Date.now()+left*1000;running=true;wake(true);render();},900);
  } else { chime("break"); mode="work"; left=WORK; }
  render();
}

/* ── コピー ── */
function copyToday(){
  const today=dayKey(new Date());
  const list=S.sessions.filter(s=>s.date===today);
  if(!list.length){ $("sendnote").textContent="今日はまだ記録がありません"; return; }
  const lines=list.map((s,i)=>`${i+1}. ${s.time} 25分${s.unit?` / ユニット${s.unit}`:""}${s.memo?` / ${s.memo}`:""}`);
  const units={}; list.forEach(s=>{ if(s.unit) units[s.unit]=(units[s.unit]||0)+1; });
  const utot=Object.keys(units).map(u=>`ユニット${u}: 累計${S.sessions.filter(s=>s.unit==u).length}回`).join(" / ");
  const text=`${today} ポモドーロ記録（${list.length}回 / ${list.length*25}分）\n`+lines.join("\n")+
    (utot?`\n${utot}`:"")+`\n\n※Notionのポモドーロ勉強記録と学習ユニットに記録して`;
  const done=()=>{ list.forEach(s=>s.sent=true); save(); render();
    $("sendnote").textContent="コピーしました。Claudeに貼りつけてください"; };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  } else fallback(text,done);
}
function fallback(text,done){
  const ta=document.createElement("textarea"); ta.value=text;
  ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
  ta.select(); try{document.execCommand("copy"); done();}catch(e){ $("sendnote").textContent="コピーできませんでした"; }
  document.body.removeChild(ta);
}

/* ── 配線 ── */
const pauseBtn=document.createElement("button");
pauseBtn.id="pause"; pauseBtn.textContent="一時停止"; pauseBtn.className="hide";
$("ctrl").insertBefore(pauseBtn,$("reset"));
$("go").onclick=start; pauseBtn.onclick=pause; $("reset").onclick=reset;
$("unit").value=S.unit||"";
$("unit").oninput=e=>{ e.target.value=e.target.value.replace(/[^0-9.]/g,""); S.unit=e.target.value; save(); render(); };
$("send").onclick=copyToday;
$("tAuto").onclick=()=>{S.autoBreak=!S.autoBreak;save();render();};
$("tSound").onclick=()=>{audio();S.soundOn=!S.soundOn;save();render();};
render(); loop();

if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
